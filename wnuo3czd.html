<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attardi Model Arrow Diagram</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: #fafafa;
    color: #222;
  }

  /* Custom styling for range input slider */
  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 10px;
    background: #e2e8f0;
    border-radius: 5px;
    outline: none;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #2563eb;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(37,99,235,0.4);
    transition: transform 0.1s ease;
  }

  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.15);
  }

  input[type=range]::-moz-range-thumb {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #2563eb;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(37,99,235,0.4);
    border: none;
  }

  /* SVG text styling */
  .node-text {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-weight: 600;
    fill: #ffffff;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
  }

  .label-text {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-weight: 600;
    fill: #4b5563;
    text-anchor: middle;
  }
</style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 sm:p-6 md:p-10">

  <header class="w-full max-w-4xl text-center mb-6">
    <h1 class="text-3xl sm:text-4xl md:text-5xl font-bold text-gray-800 tracking-tight">
      Attardi model
    </h1>
    <p class="text-base sm:text-lg text-gray-600 mt-2 max-w-xl mx-auto">
      Drag the slider to change/adjust p53 levels.
    </p>
  </header>

  <main class="w-full max-w-5xl flex flex-col items-center">
    
    <div class="w-full max-w-md bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-gray-100 mb-6 flex flex-col items-center">
      <div class="flex items-center justify-between w-full mb-2">
        <label for="slider" class="text-lg sm:text-xl font-semibold text-gray-700">
          p53 Levels
        </label>
        <span id="p53-readout" class="text-sm sm:text-base font-bold text-blue-600 bg-blue-50 px-3 py-1 rounded-full">
          50%
        </span>
      </div>
      <input type="range" id="slider" min="0" max="100" value="50" class="my-2 cursor-pointer touch-none">
      <div class="flex justify-between w-full text-xs text-gray-400 mt-1">
        <span>Low p53 (B→D High)</span>
        <span>High p53 (B→C High)</span>
      </div>
    </div>

    <div class="w-full bg-white rounded-2xl shadow-md border border-gray-100 p-2 sm:p-4 overflow-hidden relative">
      <svg id="diagram" viewBox="0 0 1280 820" class="w-full h-auto max-w-full block">
        <defs>
          <marker id="arrowC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.6" markerHeight="6.6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#2563eb" />
          </marker>
          <marker id="arrowD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.6" markerHeight="6.6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#16a34a" />
          </marker>
          <marker id="arrowAB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.6" markerHeight="6.6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#4b5563" />
          </marker>
        </defs>

        <!-- Fixed line A -> B -->
        <line id="lineAB" x1="212" y1="200" x2="528" y2="200" stroke="#4b5563" stroke-width="12" stroke-linecap="round" marker-end="url(#arrowAB)" />

        <!-- Dynamic line B -> C -->
        <line id="lineBC" x1="720" y1="200" x2="1016" y2="200" stroke="#2563eb" stroke-width="12" stroke-linecap="round" marker-end="url(#arrowC)" />

        <!-- Dynamic line B -> D -->
        <line id="lineBD" x1="624" y1="296" x2="624" y2="500" stroke="#16a34a" stroke-width="12" stroke-linecap="round" marker-end="url(#arrowD)" />

        <!-- Dynamic label overlay near B->C pathway -->
        <text x="868" y="145" class="label-text" font-size="34">p53</text>

        <!-- Node A -->
        <g transform="translate(116, 200)">
          <circle r="96" fill="#2563eb" filter="drop-shadow(0px 4px 6px rgba(37,99,235,0.3))" />
          <text class="node-text" font-size="24">
            <tspan x="0" dy="-0.6em">Pre-beta</tspan>
            <tspan x="0" dy="1.2em">cells</tspan>
          </text>
        </g>

        <!-- Node B -->
        <g transform="translate(624, 200)">
          <circle r="96" fill="#2563eb" filter="drop-shadow(0px 4px 6px rgba(37,99,235,0.3))" />
          <text class="node-text" font-size="24">
            <tspan x="0" dy="-0.6em">Meta-beta</tspan>
            <tspan x="0" dy="1.2em">cells</tspan>
          </text>
        </g>

        <!-- Node C -->
        <g transform="translate(1112, 200)">
          <circle r="96" fill="#2563eb" filter="drop-shadow(0px 4px 6px rgba(37,99,235,0.3))" />
          <text class="node-text" font-size="24">
            <tspan x="0" dy="-0.6em">Mature beta</tspan>
            <tspan x="0" dy="1.2em">cells</tspan>
          </text>
        </g>

        <!-- Node D -->
        <g transform="translate(624, 610)">
          <circle r="110" fill="#16a34a" filter="drop-shadow(0px 4px 6px rgba(22,163,74,0.3))" />
          <text class="node-text" font-size="21">
            <tspan x="0" dy="-1.2em">Fibrotic /</tspan>
            <tspan x="0" dy="1.2em">Cancer /</tspan>
            <tspan x="0" dy="1.2em">Apoptotic cells</tspan>
          </text>
        </g>

      </svg>
    </div>

    <div class="mt-6 flex flex-wrap justify-center gap-6 text-sm sm:text-base text-gray-600">
      <div class="flex items-center">
        <span class="w-3 h-3 rounded-full bg-blue-600 inline-block mr-2"></span>
        <span>Pathway B→C Width: <strong id="readout-bc" class="text-gray-800">20.0px</strong></span>
      </div>
      <div class="flex items-center">
        <span class="w-3 h-3 rounded-full bg-green-600 inline-block mr-2"></span>
        <span>Pathway B→D Width: <strong id="readout-bd" class="text-gray-800">20.0px</strong></span>
      </div>
    </div>

  </main>

  <script>
    const slider = document.getElementById('slider');
    const lineBC = document.getElementById('lineBC');
    const lineBD = document.getElementById('lineBD');
    const p53Readout = document.getElementById('p53-readout');
    const readoutBC = document.getElementById('readout-bc');
    const readoutBD = document.getElementById('readout-bd');

    const MIN_W = 4;   // thinnest line thickness
    const MAX_W = 36;  // thickest line thickness

    function update() {
      const val = Number(slider.value);
      const t = val / 100; // 0 -> 1

      // Left (0) = thinner B->C, thicker B->D
      // Right (100) = thicker B->C, thinner B->D
      const widthC = MIN_W + t * (MAX_W - MIN_W);
      const widthD = MAX_W - t * (MAX_W - MIN_W);

      lineBC.setAttribute('stroke-width', widthC.toFixed(1));
      lineBD.setAttribute('stroke-width', widthD.toFixed(1));

      p53Readout.textContent = `${val}%`;
      readoutBC.textContent = `${widthC.toFixed(1)}px`;
      readoutBD.textContent = `${widthD.toFixed(1)}px`;
    }

    slider.addEventListener('input', update);
    update();
  </script>
</body>
</html>
